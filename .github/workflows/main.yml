name: Sync to S3

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v2

    - name: Setup AWS credentials
      uses: aws-actions/configure-aws-credentials@v1
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: us-east-2

    - name: Sync directory to S3
      run: aws s3 sync . s3://dylanire.land --delete

    # The CloudFront origin is the S3 REST endpoint, which only resolves
    # index.html at the site root — a bare /dating-survey would 403 without
    # this extensionless copy. Must run after the sync: --delete removes the
    # extensionless object each deploy (it has no matching local file).
    - name: Clean URL for /dating-survey
      run: aws s3 cp dating-survey/index.html s3://dylanire.land/dating-survey --content-type "text/html; charset=utf-8"

    # CloudFront caches HTML for its default TTL (~24h), so pushes aren't
    # visible on the live domain until the cache is invalidated. Best-effort:
    # skipped silently if the deploy IAM user lacks CloudFront permissions.
    - name: Invalidate CloudFront cache
      continue-on-error: true
      run: |
        DIST_ID=$(aws cloudfront list-distributions --query "DistributionList.Items[?Aliases.Items!=null && contains(Aliases.Items, 'dylanire.land')].Id | [0]" --output text)
        if [ -n "$DIST_ID" ] && [ "$DIST_ID" != "None" ]; then
          aws cloudfront create-invalidation --distribution-id "$DIST_ID" --paths "/*"
        else
          echo "No distribution found for dylanire.land (or no permission); skipping."
        fi
